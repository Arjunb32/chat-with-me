services:
  - type: web
    name: chat-with-me
    runtime: node
    plan: starter
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: STORE_DRIVER
        value: postgres
      - key: MEDIA_DRIVER
        value: s3
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: chat-with-me-db
          property: connectionString
      - key: PGSSLMODE
        value: require
      - key: PUBLIC_ORIGIN
        sync: false
      - key: APP_SETUP_CODE
        sync: false
      - key: TURN_KEY_ID
        sync: false
      - key: TURN_KEY_API_TOKEN
        sync: false
      - key: MAX_UPLOAD_MB
        value: 12
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PREFIX
        value: attachments
      - key: BACKUP_PASSPHRASE
        sync: false

databases:
  - name: chat-with-me-db
    plan: basic-256mb
    databaseName: chatwithme
    user: chatwithme
