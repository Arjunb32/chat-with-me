services:
  - type: web
    name: chat-with-me
    runtime: node
    # Keep this free. Use an external free database; Render's free DB expires.
    plan: free
    region: singapore
    autoDeployTrigger: "off"
    numInstances: 1
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 24.19.0
      - key: STORE_DRIVER
        value: postgres
      - key: MEDIA_DRIVER
        value: s3
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        sync: false
      - key: PGSSLMODE
        value: require
      - key: PUBLIC_ORIGIN
        sync: false
      - key: APP_SETUP_CODE
        sync: false
      - key: METERED_TURN_APP_NAME
        sync: false
      - key: METERED_TURN_API_KEY
        sync: false
      - key: RTC_RELAY_ONLY
        value: "true"
      - key: MAX_UPLOAD_MB
        value: 12
      - key: S3_BUCKET
        sync: false
      - key: S3_ENDPOINT
        sync: false
      - key: S3_REGION
        sync: false
      - key: S3_FORCE_PATH_STYLE
        value: "true"
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_PREFIX
        value: attachments
      - key: BACKUP_PASSPHRASE
        sync: false
